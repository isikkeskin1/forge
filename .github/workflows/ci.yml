name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure with sanitizers
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer

      - name: Build
        run: cmake --build build --parallel

      - name: Test under sanitizers
        run: ctest --test-dir build --output-on-failure

  benchmark-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure benchmarks
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DFORGE_BUILD_BENCHMARKS=ON

      - name: Build benchmarks
        run: cmake --build build --parallel

      - name: Smoke test pipeline benchmark
        run: ./build/forge_bench_pipeline 100000

      - name: Test external result comparator
        run: python3 -m unittest tests/test_compare_results.py

      - name: Smoke test external reference workload
        run: python3 bench/external/baseline.py --rows 10000 --rounds 1 --threshold 0 > /tmp/reference.csv
